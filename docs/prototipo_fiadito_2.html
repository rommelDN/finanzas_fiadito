<style>
:root{
  --bg:#F3F5F4;--card:#FFFFFF;--text:#14201B;--muted:#65736C;--line:#E2E7E4;--head:#F7F9F8;
  --pri:#0E7C66;--pri-d:#0A5C4C;--pri-s:#E2F2ED;--side:#0F2A23;--side-t:#A9C2B9;--side-a:#1C4A3D;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}

.logo .sq{width:36px;height:36px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}

nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;font-weight:500;margin-bottom:4px}

.user{margin-top:auto;border-top:1px solid var(--side-a);padding-top:16px;display:flex;gap:10px;align-items:center}

main{flex:1;padding:28px 40px 40px;min-width:0}

.tip:hover::after{content:attr(data-h);position:absolute;left:22px;top:-6px;z-index:20;width:240px;background:var(--side);color:#fff;font-weight:400;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
@media print{aside,.btn{display:none!important}}
</style>

<body>
<div id="root"></div>
<script>
// ==================== Motor de cálculo (según 6.3) ====================
const red2=x=>Math.round((x+1e-9)*100)/100;
const s2=x=>red2(x).toFixed(2);
const soles=x=>'S/ '+red2(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(x,d=2)=>x.toFixed(d)+'%';
const PER={DIARIA:1,QUINCENAL:15,MENSUAL:30,BIMESTRAL:60,TRIMESTRAL:90,CUATRIMESTRAL:120,SEMESTRAL:180,ANUAL:360};
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const mk=(y,m,d)=>{while(m>12){m-=12;y++}while(m<1){m+=12;y--}return{y,m,d:Math.min(d,lastDay(y,m))}};
const addM=(f,k,dia)=>mk(f.y,f.m+k,dia??f.d);
const d360=(a,b)=>360*(b.y-a.y)+30*(b.m-a.m)+(Math.min(b.d,30)-Math.min(a.d,30));
const fmt=f=>String(f.d).padStart(2,'0')+'/'+String(f.m).padStart(2,'0')+'/'+f.y;
const cmp=(a,b)=>(a.y-b.y)||(a.m-b.m)||(a.d-b.d);
const parseF=s=>{const[d,m,y]=s.split('/').map(Number);return{y,m,d}};
const teD=(te,p,d)=>Math.pow(1+te/100,d/p)-1;

function ciclo(cli,f,hh,mm){ // fechaCorteCiclo y fechaFinGracia
  let corte=mk(f.y,f.m,cli.corte);
  const despues=cmp(f,corte)>0||(cmp(f,corte)===0&&(hh*60+mm)>23*60+59);
  if(despues)corte=mk(f.y,f.m+1,cli.corte);
  let fin=mk(corte.y,corte.m,cli.pago);
  if(cmp(fin,corte)<=0)fin=mk(corte.y,corte.m+1,cli.pago);
  return{corte,fin};
}
function calcCompra(cli,fecha,hh,mm,items,n){
  const C=red2(items.reduce((s,[c,q])=>s+red2(q*PROD[c].pc),0));
  const{corte,fin}=ciclo(cli,fecha,hh,mm);
  const dg=d360(fecha,fin);
  const tg=teD(cli.te,cli.p,dg);
  const Cg=red2(C*(1+tg));
  const ig=red2(Cg-C);
  const tem=teD(cli.te,cli.p,30);
  const R=tem>0?red2(Cg*tem/(1-Math.pow(1+tem,-n))):red2(Cg/n);
  let S=Cg;const cuotas=[];
  for(let k=1;k<=n;k++){
    const I=red2(S*tem);let A,Rk;
    if(k<n){A=red2(R-I);Rk=R}else{A=S;Rk=red2(A+I)}
    cuotas.push({k,venc:addM(fin,k,cli.pago),si:S,I,A,R:Rk,sf:red2(S-A)});S=red2(S-A);
  }
  // TCEA: C = Σ R_k / (1+t)^((dg+30k)/360)
  const f=t=>cuotas.reduce((s,q)=>s+q.R/Math.pow(1+t,(dg+30*q.k)/360),0)-C;
  let lo=0,hi=5;for(let i=0;i<200;i++){const mi=(lo+hi)/2;f(mi)>0?lo=mi:hi=mi}
  const tI=red2(ig+cuotas.reduce((s,q)=>s+q.I,0));
  return{C,corte,fin,dg,tg,Cg,ig,tem,R,cuotas,tcea:lo*100,tI,tP:red2(C+tI)};
}

// ==================== Datos de prueba (6.4) ====================
const PROD={
 P001:{d:'Arroz extra 5 kg',m:'Costeño',pr:'Dist. Santa Rosa',u:'UND',pc:22.00,pcr:24.00,fia:true,max:6,act:true},
 P002:{d:'Aceite vegetal 1 L',m:'Primor',pr:'Dist. Santa Rosa',u:'UND',pc:9.50,pcr:10.50,fia:true,max:6,act:true},
 P003:{d:'Leche evaporada 400 g',m:'Gloria',pr:'Dist. Santa Rosa',u:'UND',pc:4.20,pcr:4.60,fia:true,max:6,act:true},
 P004:{d:'Atún en aceite 170 g',m:'Florida',pr:'Dist. Santa Rosa',u:'UND',pc:5.00,pcr:5.50,fia:true,max:6,act:true},
 P005:{d:'Azúcar rubia 1 kg',m:'Cartavio',pr:'Dist. Santa Rosa',u:'KG',pc:3.30,pcr:3.60,fia:true,max:6,act:true},
 P006:{d:'Detergente 2 kg',m:'Bolívar',pr:'Dist. Santa Rosa',u:'UND',pc:16.50,pcr:18.00,fia:true,max:6,act:true},
 P007:{d:'Balón de gas 10 kg',m:'Solgas',pr:'Gasocentro Lima',u:'UND',pc:50.00,pcr:55.00,fia:true,max:2,act:true},
 P008:{d:'Recarga celular S/ 10',m:'Claro',pr:'Claro Agente',u:'UND',pc:10.00,pcr:10.00,fia:false,max:1,act:true},
 P009:{d:'Fideos spaghetti 500 g',m:'Don Vittorio',pr:'Dist. Santa Rosa',u:'UND',pc:2.80,pcr:3.00,fia:true,max:6,act:false}};
const CLI={
 rosa:{id:'rosa',n:'Rosa Quispe Huamán',ini:'RQ',dni:'45678901',te:6.1363551,per:'BIMESTRAL',tm:6.1208,perm:'SEMESTRAL',lim:1000,max:6,corte:20,pago:26},
 carlos:{id:'carlos',n:'Carlos Mendoza Ríos',ini:'CM',dni:'41234567',te:20,per:'SEMESTRAL',tm:6,perm:'SEMESTRAL',lim:800,max:4,corte:25,pago:5},
 mario:{id:'mario',n:'Mario Paredes Salas',ini:'MP',dni:'43219876',te:1.5105456,per:'QUINCENAL',tm:0.4007475,perm:'QUINCENAL',lim:600,max:4,corte:20,pago:26}};
Object.values(CLI).forEach(c=>{c.p=PER[c.per];c.pm=PER[c.perm];c.tem=teD(c.te,c.p,30)*100;c.tea=teD(c.te,c.p,360)*100;c.team=teD(c.tm,c.pm,360)*100});
const COMPRAS=[
 ['CR1','rosa','15/09/2026',10,30,[['P001',2],['P002',2],['P003',6],['P004',4],['P005',2],['P006',1]],3],
 ['CC1','carlos','27/09/2026',14,0,[['P007',1],['P001',2],['P002',1],['P004',4]],2],
 ['CM1','mario','10/08/2026',9,0,[['P001',2],['P002',2],['P004',4],['P006',1]],3],
 ['CM2','mario','03/09/2026',18,0,[['P007',1]],1],
 ['CM3','mario','15/09/2026',11,0,[['P003',12],['P005',5],['P002',2]],2],
 ['CM4','mario','24/09/2026',16,0,[['P001',1],['P005',2]],1]
].map(([id,cli,f,hh,mm,items,n])=>({id,cli,fecha:f,hh,mm,items,n,...calcCompra(CLI[cli],parseF(f),hh,mm,items,n)}));
// Mario pagó la cuota 1 de CM1 el 26/09/2026
COMPRAS.find(c=>c.id==='CM1').cuotas[0].pagada=true;
const HOY=parseF('02/10/2026');
function deuda(cid){return red2(COMPRAS.filter(c=>c.cli===cid).reduce((s,c)=>s+c.Cg-c.cuotas.filter(q=>q.pagada).reduce((a,q)=>a+q.A,0),0))}
function deudaAntes(cid,f,hh,mm){const key=x=>x.y*1e6+x.m*1e4+x.d*100;const t=key(f)*10000+hh*100+mm;return red2(COMPRAS.filter(c=>c.cli===cid&&key(parseF(c.fecha))*10000+c.hh*100+c.mm<t).reduce((s,c)=>s+c.Cg-c.cuotas.filter(q=>q.pagada&&cmp(q.venc,f)<=0).reduce((a,q)=>a+q.A,0),0))}
function estado(cid,vencStr){const v=parseF(vencStr);const it=[];COMPRAS.filter(c=>c.cli===cid).forEach(c=>c.cuotas.forEach(q=>{if(!q.pagada&&cmp(q.venc,v)===0)it.push({c,q})}));const cap=red2(it.reduce((s,x)=>s+x.q.A,0)),int=red2(it.reduce((s,x)=>s+x.q.I,0));return{it,cap,int,total:red2(cap+int)}}
function proxPago(cid){let best=null;COMPRAS.filter(c=>c.cli===cid).forEach(c=>c.cuotas.forEach(q=>{if(!q.pagada&&cmp(q.venc,HOY)>=0&&(!best||cmp(q.venc,best)<0))best=q.venc}));return best}

// ==================== UI ====================
const IC={home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',wallet:'<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>',file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>',sliders:'<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',check:'<path d="M20 6 9 17l-5-5"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const NAV=[['inicio','Inicio','home'],['clientes','Clientes','users'],['productos','Productos','box'],['compras','Compras','cart'],['pago','Pagos','wallet'],['estados','Estados de cuenta','file'],['parametros','Parámetros','sliders'],['flujo','Cómo funciona','info']];
const badge=(t,c='ok')=>`<span class="badge ${c}">${t}</span>`;
const hdr=(t,s,btns='',crumb='')=>`${crumb?`<div class="crumb">${crumb}</div>`:''}<div class="hdr"><div class="t"><h1>${t}</h1>${s?`<div class="sub">${s}</div>`:''}</div>${btns}</div>`;
const two=(a,b)=>`<div class="b">${a}</div><div class="m sm">${b}</div>`;
const prodCell=(c)=>`<div class="prod"><div class="thumb">${c}</div>${two(PROD[c].d,PROD[c].m+' · '+PROD[c].pr)}</div>`;
const MES=['','ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

const V={};
V.inicio=()=>{
  const cl=Object.values(CLI);
  const tDeuda=red2(cl.reduce((s,c)=>s+deuda(c.id),0));const tLim=cl.reduce((s,c)=>s+c.lim,0);
  const eR=estado('rosa','26/10/2026'),eM=estado('mario','26/10/2026');
  const venc=[];COMPRAS.forEach(c=>c.cuotas.forEach(q=>{if(!q.pagada)venc.push({c,q})}));
  const grp={};venc.forEach(({c,q})=>{const k=fmt(q.venc)+c.cli;(grp[k]=grp[k]||{v:q.venc,cli:c.cli,n:0,t:0}).n++;grp[k].t=red2(grp[k].t+q.R)});
  const lista=Object.values(grp).sort((a,b)=>cmp(a.v,b.v)).slice(0,5);
  return hdr('Buen día, Luis','Viernes 2 de octubre de 2026 · Próximo corte: 20/10/2026 23:59',`<a class="btn" href="#pago">Registrar pago</a><a class="btn pri" href="#nueva">+ Nueva compra</a>`)+
  `<div class="row">
    <div class="card kpi"><div class="l">Deuda por cobrar</div><div class="v">${soles(tDeuda)}</div><div class="s">Capital pendiente de 3 clientes</div></div>
    <div class="card kpi"><div class="l">Crédito disponible</div><div class="v">${soles(tLim-tDeuda)}</div><div class="s">de ${soles(tLim)} en límites</div></div>
    <div class="card kpi"><div class="l">Vence el 26/10</div><div class="v" style="color:var(--pri)">${soles(eR.total+eM.total)}</div><div class="s">Rosa Quispe y Mario Paredes</div></div>
    <div class="card kpi"><div class="l">En mora</div><div class="v" style="color:var(--ok)">S/ 0.00</div><div class="s">Ningún cliente atrasado</div></div>

  <div style="flex:2"><div class="doc">

   <div style="margin-top:14px"><div class="kv"><span>Total capital</span><span>${soles(e.cap)}</span></div><div class="kv"><span>Total intereses de cuotas</span><span>${soles(e.int)}</span></div><div class="kv"><span>Intereses moratorios</span><span>S/ 0.00</span></div>
   <div class="kv" style="border-top:1px solid var(--text);margin-top:6px;padding-top:10px"><span class="b" style="color:var(--text);font-size:15px">TOTAL A PAGAR</span><span style="font-size:22px;font-weight:700;color:var(--pri)">${soles(e.total)}</span></div></div>

// ---- Registrar pago (interactivo) ----
const PG={sel:'mario',fecha:'2026-11-06',medio:'EFECTIVO'};
V.pago=()=>hdr('Registrar pago','Escribe la fecha real para calcular la mora',`<a class="btn" href="#estados">Cancelar</a><button class="btn pri" id="pg_ok" onclick="alert('Prototipo: el pago no se guarda.')">Registrar pago</button>`,'Pagos  /  Registrar pago')+
 `<div class="row"><div class="card" style="flex:2"><h2>Datos del pago</h2>
  <div class="f"><label>Estado de cuenta</label><select onchange="PG.sel=this.value;pgRender()">${['mario','rosa'].map(id=>`<option value="${id}" ${id===PG.sel?'selected':''}>${CLI[id].n} · corte 20/10/2026 · ${soles(estado(id,'26/10/2026').total)}</option>`).join('')}</select></div>
  <div class="frow"><div class="f"><label>Fecha de pago pactada</label><input value="26/10/2026" disabled></div><div class="f"><label>Fecha real de pago</label><input type="date" value="${PG.fecha}" onchange="PG.fecha=this.value;pgRender()"><span class="h" id="pg_dh"></span></div></div>
  <div class="f"><label>Medio de pago</label><div class="seg">${['EFECTIVO','YAPE','PLIN','TRANSFERENCIA'].map(x=>`<button ${x===PG.medio?'class="on"':''} onclick="PG.medio='${x}';document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.textContent==='${x}'))">${x}</button>`).join('')}</div></div>
  <div class="f"><label>Monto pagado (S/)</label><input id="pg_monto" oninput="pgCheck()"><span class="h" id="pg_mh"></span></div>
 </div><div class="card side340" style="flex:0 0 400px!important" id="pg_res"></div></div>`;
let PGT=0;
window.pgRender=()=>{const c=CLI[PG.sel];const e=estado(PG.sel,'26/10/2026');const[y,m,d]=PG.fecha.split('-').map(Number);
 const dm=Math.max(0,d360(parseF('26/10/2026'),{y,m,d}));const tmp=teD(c.tm,c.pm,dm);const mora=red2(e.total*tmp);PGT=red2(e.total+mora);
 document.getElementById('pg_dh').textContent=dm?dm+' días de atraso (30E/360)':'Pago puntual';
 document.getElementById('pg_monto').value=PGT.toFixed(2);
 document.getElementById('pg_res').innerHTML=`<h2>Cálculo del pago</h2>
  <div class="kv"><span>Total capital</span><span>${soles(e.cap)}</span></div><div class="kv"><span>Total intereses de cuotas</span><span>${soles(e.int)}</span></div>
  <div class="kv"><span>Días de mora</span><span style="color:${dm?'var(--red)':'inherit'}">${dm}</span></div>
  <div class="kv"><span>tasaMoraAplicada (${dm} días)</span><span>${(tmp*100).toFixed(7)}%</span></div>
  <div class="kv"><span>Interés moratorio</span><span style="color:${mora?'var(--red)':'inherit'}">${soles(mora)}</span></div>
  <div class="kv big" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><span class="b" style="color:var(--text)">Total a pagar</span><span>${soles(PGT)}</span></div>
  <div class="m sm" style="margin:14px 0 8px;font-weight:500">Cómo se aplica el pago (prelación)</div>
  <div class="kv"><span>1. Interés moratorio</span><span>${soles(mora)}</span></div><div class="kv"><span>2. Intereses de las cuotas</span><span>${soles(e.int)}</span></div><div class="kv"><span>3. Capital (amortización)</span><span>${soles(e.cap)}</span></div>
  <div class="note pri-b">Después del pago, la deuda pendiente baja a ${soles(deuda(PG.sel)-e.cap)} y el crédito disponible sube a ${soles(c.lim-deuda(PG.sel)+e.cap)}.</div>`;
 pgCheck();};
window.pgCheck=()=>{const v=+document.getElementById('pg_monto').value;const okp=red2(v)===PGT;const h=document.getElementById('pg_mh');h.textContent=okp?'✓ Coincide con el total a pagar':'No se permiten pagos parciales. Total: '+soles(PGT);h.style.color=okp?'var(--ok)':'var(--red)';document.getElementById('pg_ok').disabled=!okp};

V.parametros=()=>hdr('Parámetros','Datos de la tienda y valores que usan todos los cálculos',`<button class="btn pri" onclick="alert('Prototipo: no se guarda.')">Guardar cambios</button>`)+
 `<div class="row"><div class="card"><h2>Datos de la tienda</h2><div class="f"><label>RUC</label><input value="20512345671"></div><div class="f"><label>Razón social</label><input value="Comercial Don Lucho E.I.R.L."></div><div class="f"><label>Nombre comercial</label><input value="Bodega Don Lucho"></div><div class="f"><label>Giro de negocio</label><input value="Bodega"></div></div>
  <div class="card"><h2>Base de cálculo</h2>${[['baseDias','360'],['diasMes','30'],['decimalesMoneda','2'],['decimalesTasaMinimos','7 (precisión interna conservada)'],['baseMora','TOTAL_VENCIDO'],['Tasas','Solo efectivas'],['Método','Francés vencido, simple y ordinario'],['Gracia','Total (se capitaliza)']].map(([a,b])=>`<div class="kv"><span>${a}</span><span>${b}</span></div>`).join('')}

  <div class="table-wrap"><table><thead><tr><th>Parámetro</th><th>Moneda</th><th>Valor (TEA)</th><th>Vigencia desde</th><th>Vigencia hasta</th></tr></thead><tbody>
  <tr><td class="b">topeInteresTEA</td><td>PEN</td><td class="m">[valor vigente BCRP]</td><td>—</td><td>—</td></tr><tr><td class="b">topeMoraTEA</td><td>PEN</td><td class="m">[valor vigente BCRP]</td><td>—</td><td>—</td></tr></tbody></table></div>

V.flujo=()=>hdr('Cómo funciona Fiadito','Solo tasas efectivas y método francés vencido, simple y ordinario')+
 `<div class="flow mb20">${[['1','Configura','Datos de la tienda, base 360/30 y topes BCRP.'],['2','Productos','Precio al contado (precio aplicado), si se fía y máx. de cuotas.'],['3','Clientes','Tasa efectiva y su periodo, mora, límite, corte y pago.'],['4','Compra','Valida, asigna ciclo, capitaliza la gracia y arma el cronograma.'],['5','Corte','Junta las cuotas que vencen y genera el estado de cuenta.'],['6','Pago','Total exacto + mora si hay atraso. Mora → interés → capital.']].map(s=>`<div class="card"><div class="n">${s[0]}</div><div class="b" style="font-size:16px;margin-bottom:6px">${s[1]}</div><div class="m sm">${s[2]}</div></div>`).join('')}</div>
 <div class="card"><h2>Fórmulas (apartado 6.3)</h2>
  ${[['Tasa efectiva para d días','TE_d = (1 + i)^(d/p) − 1'],['TEM','TEM = (1 + i)^(30/p) − 1'],['TEA','TEA = (1 + i)^(360/p) − 1'],['Gracia total','capitalFinanciado = red₂[C × (1 + tasaGracia)]'],['Cuota (método francés)','R = red₂[Cg × TEM / (1 − (1 + TEM)^−n)]'],['Cuadro','I_k = red₂(S_k−1 × TEM) · A_k = R − I_k · S_k = S_k−1 − A_k'],['Mora','moraObligacion = red₂(saldoVencido × [(1 + i_m)^(diasMora/pMora) − 1])'],['TCEA','C = Σ R_k / (1 + t)^((diasGracia + 30k)/360) · tcea = 100 × t']].map(([a,b])=>`<div class="kv"><span>${a}</span><span style="font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500">${b}</span></div>`).join('')}</div>`;

function render(){
  const[r,arg]=(location.hash.slice(1)||'login').split('/');
  const root=document.getElementById('root');
  if(r==='login'||!V[r]){root.innerHTML=login();window.scrollTo(0,0);return}
  root.innerHTML=`<div class="app"><aside><div class="logo"><div class="sq">F</div><div><b>Fiadito</b><small>Bodega Don Lucho</small></div></div>
   <nav>${NAV.map(([k,t,i])=>`<a href="#${k}" class="${ROUTE_NAV[r]===k?'on':''}">${ico(i)}${t}</a>`).join('')}</nav>
   <div class="user"><div class="av">LT</div><div><b>Luis Torres Ramos</b><small>ADMIN_NEGOCIO · <a href="#login" style="text-decoration:underline">Salir</a></small></div></div></aside>
   <main>${V[r](arg)}</main></div>`;
  if(r==='nueva')ncRender();if(r==='pago')pgRender();if(r==='nuevocliente')ncCalc();

}

function addHelp(){document.querySelectorAll('.f > label').forEach(l=>{const k=l.textContent.trim();const h=HELP[k]||(k.startsWith('Número de cuotas')?'Entre 1 y el menor máximo entre el cliente y los productos elegidos.':null);if(h&&!l.querySelector('.tip')){const t=document.createElement('span');t.className='tip';t.textContent='?';t.setAttribute('data-h',h);t.setAttribute('title',h);l.appendChild(t)}})}
