name: fiadito

services:
  db:
    image: mysql:8.4
    container_name: fiadito-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fiadito}
      MYSQL_DATABASE: ${DB_NAME:-fiadito}
      TZ: America/Lima
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=-05:00"]
    ports:
      # 3307 en el host para no chocar con un MySQL local (Workbench) en 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-fiadito}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Desarrollo: API NestJS con recarga. Aplica migraciones y seed al arrancar.
  backend:
    image: node:22-alpine
    container_name: fiadito-backend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:${DB_ROOT_PASSWORD:-fiadito}@db:3306/${DB_NAME:-fiadito}
      PORT: "3000"
      TZ: America/Lima
    volumes:
      - ./backend:/app
    command: sh -c "npm install --no-audit --no-fund && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
    ports:
      - "3000:3000"

  # Desarrollo: React + Vite. /api y /uploads se reenvían al backend.
  frontend:
    image: node:22-alpine
    container_name: fiadito-frontend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  db_data:
